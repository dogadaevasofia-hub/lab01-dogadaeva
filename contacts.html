    </select>
    <br><br>

    <label for="message">Текст повідомлення</label><br>
    <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
    <br><br>

        <input type="checkbox" name="consent" required>
        Погоджуюсь на обробку персональних даних
    </label>
    <br><br>
